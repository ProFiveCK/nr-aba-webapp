name: ron-stack-prod

services:
  # === Database ===
  postgres:
    image: postgres:15-alpine
    container_name: ron-aba-postgres-prod
    restart: unless-stopped
    # Only the three POSTGRES_* values below; the rest of .env.prod (JWT
    # secret, SMTP password, encryption keys) has no business in this container.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aba}
    volumes:
      - ron-stack_pgdata:/var/lib/postgresql/data
    dns:
      - 10.10.10.11
      - 10.10.10.118
      - 8.8.8.8
    networks:
      - ron-net
    # No watchtower label: the database is upgraded by hand, after a backup,
    # never restarted unattended by an image refresh.
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d aba || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    # Do NOT publish 5432 publicly, keep it internal to the network

    # === API ===
  api:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    container_name: ron-aba-backend-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DB_HOST: postgres
      PAYROLL_SCRIPT_PATH: /app/scripts/reformat_payroll.py
    depends_on:
      postgres:
        condition: service_healthy
    # Allow access to host machine for Windows sync service
    # On Linux, this enables host.docker.internal to work
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 10.10.10.11
      - 10.10.10.118
      - 8.8.8.8
    networks:
      ron-net:
        aliases:
          - ron-aba-backend
          - api
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:4000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));\"" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # === Web (static site served by Nginx, custom nginx.conf mounts) ===
  web:
    image: nginx:alpine
    container_name: ron-aba-generator-prod
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./app/client/dist:/usr/share/nginx/html
      - ./app/docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ron-net
    labels:
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.1 80 || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # === Watchtower (auto-updates) ===
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower-ronstack
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: Pacific/Nauru
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      DOCKER_API_VERSION: "1.44"
    networks:
      - ron-net

  # The Portainer agent lives in docker-compose.portainer.yml and is started
  # on its own, only on hosts that are managed through Portainer.

volumes:
  ron-stack_pgdata:
    external: true

networks:
  # This stack now expects an existing external network named "ron-net".
  # Create it with: docker network create ron-net
  ron-net:
    external: true
