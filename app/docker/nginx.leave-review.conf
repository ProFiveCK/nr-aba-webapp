map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 80;
    resolver 127.0.0.11 valid=10s;
    set $review_api http://api:4000;
    set $review_login http://review-login:4001;
    set $review_client http://client:5173;
    client_max_body_size 10m;
    location /api/ {
        proxy_pass $review_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /health { proxy_pass $review_api/health; }
    location /review/ { proxy_pass $review_login; proxy_set_header Host $host; }
    location / {
        proxy_pass $review_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        add_header Cache-Control "no-store";
    }
}
