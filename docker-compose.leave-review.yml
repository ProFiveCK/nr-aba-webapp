# Isolated alternative to the shared-volume development stack. Local review only.
name: ron-leave-review
services:
  postgres:
    restart: unless-stopped
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: leave_review
      POSTGRES_PASSWORD: ${LEAVE_REVIEW_DB_PASSWORD:?}
      POSTGRES_DB: leave_review
    volumes:
      - review_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U leave_review -d leave_review]
      interval: 3s
      timeout: 3s
      retries: 30
  api:
    build:
      context: .
      dockerfile: app/backend/Dockerfile.leave-review
    restart: unless-stopped
    image: ron-leave-review-api:local
    command: [node, --watch, src/server.js]
    environment: &review_environment
      NODE_ENV: development
      DB_HOST: postgres
      DB_USER: leave_review
      DB_PASSWORD: ${LEAVE_REVIEW_DB_PASSWORD}
      DB_NAME: leave_review
      JWT_SECRET: ${LEAVE_REVIEW_JWT_SECRET}
      SMTP_ENC_KEY: ${LEAVE_REVIEW_ENC_KEY}
      DATA_ENC_KEY: ${LEAVE_REVIEW_ENC_KEY}
      FRONTEND_BASE_URL: http://localhost:${LEAVE_REVIEW_PORT:-8081}
      CORS_ORIGIN: http://localhost:${LEAVE_REVIEW_PORT:-8081},http://127.0.0.1:${LEAVE_REVIEW_PORT:-8081}
      SMTP_HOST: ''
      ACCRUAL_SCHEDULER: 'off'
      GOVERNMENT_LEAVE_SCHEDULER: 'off'
      AI_HELPER_ENABLED: 'false'
      TZ: Pacific/Nauru
    volumes:
      - ./app/backend/src:/app/src:ro
      - review_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
  client:
    restart: unless-stopped
    image: ron-leave-review-api:local
    pull_policy: never
    working_dir: /client
    environment:
      NODE_ENV: development
    command: [sh, /app/leave-review-client.sh]
    volumes:
      - ./app/client:/client
      - review_client_modules:/client/node_modules
      - review_npm_cache:/root/.npm
      - ./scripts/leave-review-client.sh:/app/leave-review-client.sh:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      start_period: 120s
      retries: 60
  review-login:
    restart: unless-stopped
    image: ron-leave-review-api:local
    pull_policy: never
    command: [node, /app/leave-review-login.mjs]
    environment:
      <<: *review_environment
      LEAVE_REVIEW_ONLY: 'synthetic'
    volumes:
      - ./app/backend/src:/app/src:ro
      - ./scripts/leave-review-login.mjs:/app/leave-review-login.mjs:ro
      - ./scripts/leave-review-seed.mjs:/app/leave-review-seed.mjs:ro
    depends_on:
      api:
        condition: service_healthy
  web:
    restart: unless-stopped
    image: nginx:alpine
    ports:
      - "127.0.0.1:${LEAVE_REVIEW_PORT:-8081}:80"
    volumes:
      - ./app/docker/nginx.leave-review.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      client:
        condition: service_healthy
      review-login:
        condition: service_started
volumes:
  review_db:
  review_client_modules:
  review_npm_cache:
  review_uploads:
