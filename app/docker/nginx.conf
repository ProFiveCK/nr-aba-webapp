server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    client_max_body_size 10m;
    server_tokens off;

    # Security headers for the single-page app. TLS ends upstream, so HSTS
    # reaches the browser over https. Google sign-in needs its gsi origins;
    # nothing else loads from outside.
    #
    # nginx only inherits these into a location that has no add_header of its
    # own, so the locations below set caching with `expires`, not add_header.
    # /api/ responses also carry helmet's copies; duplicates are harmless.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        expires -1;
    }

    # Content-hashed, so they can be cached for good.
    location /assets/ {
        try_files $uri =404;
        expires max;
    }

    # index.html and SPA routes are revalidated every time, so a deploy is
    # picked up on the next page load.
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    location /api/ {
        proxy_pass http://ron-aba-backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://ron-aba-backend:4000/health;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
