name: ron-stack-dev

services:
  # === Database ===
  postgres:
    image: postgres:15-alpine
    container_name: ron-aba-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aba}
    volumes:
      - ron-stack_pgdata:/var/lib/postgresql/data
    networks:
      - ron-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aba} || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    # Postgres stays internal to ron-net; no host port is published.

  # === API ===
  api:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    container_name: ron-aba-backend-dev
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DB_HOST: postgres
      PAYROLL_SCRIPT_PATH: /app/scripts/reformat_payroll.py
      FRONTEND_BASE_URL: http://localhost:8081
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      ron-net:
        aliases:
          - ron-aba-backend
          - api
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:4000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));\"" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # === Web (static site served by Nginx) ===
  web:
    image: nginx:alpine
    container_name: ron-aba-web-dev
    restart: unless-stopped
    ports:
      - "${DEV_WEB_PORT:-8081}:80"
    volumes:
      - ./app/client/dist:/usr/share/nginx/html
      - ./app/docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ron-net
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.1 80 || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ron-stack_pgdata:
    external: true

networks:
  ron-net:
    external: true
